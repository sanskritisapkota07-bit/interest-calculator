<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interest Calculator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Great+Vibes&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="stage">
  <div class="calculator">
    <h1>Interest Calculator</h1>

    <label>Principal Amount</label>
    <input type="number" id="principal" placeholder="Enter amount">

    <label>Interest Rate (%)</label>
    <input type="number" id="rate" placeholder="Enter rate">

    <label>Time (Years)</label>
    <input type="number" id="time" placeholder="Enter years">

    <button onclick="calculateInterest()">Calculate</button>

    <div id="result"></div>
  </div>

  <div class="maker-pendant" aria-label="Made by Sanskriti">
    <span class="maker-cord"></span>
    <span class="maker-knot"></span>
    <div class="maker-seal">
      <span class="maker-ring"></span>
      <span class="maker-gleam"></span>
      <div class="maker-orbit" aria-hidden="true">
        <span style="--i:0">M</span><span style="--i:1">A</span><span style="--i:2">D</span><span style="--i:3">E</span>
        <span style="--i:4">•</span>
        <span style="--i:5">B</span><span style="--i:6">Y</span>
        <span style="--i:7">•</span>
        <span style="--i:8">S</span><span style="--i:9">A</span><span style="--i:10">N</span><span style="--i:11">S</span><span style="--i:12">K</span><span style="--i:13">R</span><span style="--i:14">I</span><span style="--i:15">T</span><span style="--i:16">I</span>
        <span style="--i:17">•</span>
      </div>
      <span class="maker-sig">sanskriti</span>
      <span class="maker-year">est. 2026</span>
    </div>
  </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
